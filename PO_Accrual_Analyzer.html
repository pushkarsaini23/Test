<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useCallback,useMemo}=React;
const MON_NAMES=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const MON_LABELS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

// ═══════════════════════════════════════════════════════
// DYNAMIC MONTH RANGE
// Start: Jan of (currentYear - 1) → always covers ~20 months
// End:   current month (auto-detected, expands each month)
// Rule: 2025-2026 → Jan-25 start; 2027+ → Jan-26 start etc.
// ═══════════════════════════════════════════════════════
function buildMonthRange(){
  const now=new Date();
  const cy=now.getFullYear();
  const cm=now.getMonth()+1; // 1-12
  const sy=cy-1; // start year always previous year Jan
  const months=[];
  let y=sy,m=1;
  while(y<cy||(y===cy&&m<=cm)){
    months.push(`${MON_LABELS[m-1]}-${String(y).slice(2)}`);
    m++;if(m>12){m=1;y++;}
  }
  return months;
}

function getCurrentMonthKey(){
  const now=new Date();
  return `${MON_LABELS[now.getMonth()]}-${String(now.getFullYear()).slice(2)}`;
}

const ALL_MONTHS=buildMonthRange();
const CURRENT_MONTH=getCurrentMonthKey();
const CURRENT_MONTH_IDX=ALL_MONTHS.indexOf(CURRENT_MONTH);

// ═══════════════════════════════════════════════════════
// PARSERS
// ═══════════════════════════════════════════════════════
function parseActivityPeriod(val){
  if(val==null||val==="")return null;
  if(typeof val==="number"&&val>10000){
    const d=XLSX.SSF.parse_date_code(val);
    if(!d)return null;
    const mon=MON_NAMES[d.m-1];if(!mon)return null;
    return `${mon[0].toUpperCase()+mon.slice(1)}-${String(d.y).slice(2)}`;
  }
  const s=String(val).trim();
  const m=s.match(/^(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*[\s\-\/](\d{2,4})$/i);
  if(m){
    const mon=m[1][0].toUpperCase()+m[1].slice(1).toLowerCase();
    let yr=m[2];if(yr.length===4)yr=yr.slice(2);
    return `${mon}-${yr}`;
  }
  const m2=s.match(/^(\d{1,2})[\/\-](\d{4})$/)||s.match(/^(\d{4})[\/\-](\d{2})$/);
  if(m2){
    let mn=parseInt(m2[1]),yr=m2[2];
    if(mn>12){mn=parseInt(m2[2]);yr=m2[1];}
    if(mn<1||mn>12)return null;
    return `${MON_LABELS[mn-1]}-${String(yr).slice(-2)}`;
  }
  return null;
}

function parseAmt(v){
  if(v==null||v==="")return 0;
  if(typeof v==="number")return v;
  return parseFloat(String(v).replace(/[,$()]/g,""))||0;
}

// ═══════════════════════════════════════════════════════
// AUTO-DETECT COLUMNS
// ═══════════════════════════════════════════════════════
function autoDetectCols(headers){
  const h=headers.map(x=>String(x??"").toLowerCase().trim());
  const find=(...kws)=>{
    for(const kw of kws){const i=h.findIndex(x=>x.includes(kw));if(i>=0)return headers[i];}
    return null;
  };
  return{
    eGBSCol:           find("parent egbs","parent_egbs","parentegbs","egbs parent","egbs"),
    poCol:             find("purchase order no","purchase order","po number","po no","po#","p.o"),
    activityPeriodCol: find("activity period","actperiod","period","activity_period","act period"),
    amtCol:            find("amt","amount","sum of amt","total amt"),
    invDtCol:          find("inv dt","invoice dt","invoice date","inv date","invdt"),
  };
}

// ═══════════════════════════════════════════════════════
// BUILD PIVOT — eGBS + PO grouping
// ═══════════════════════════════════════════════════════
function buildPivotFromRaw(ws,colMap){
  const raw=XLSX.utils.sheet_to_json(ws,{defval:null,raw:true});
  if(!raw.length)return null;
  const{eGBSCol,poCol,activityPeriodCol,amtCol,invDtCol}=colMap;
  if(!poCol||!activityPeriodCol||!amtCol)return null;

  const pivot={}; // pivot[egbs][po][mk]={amt,invDts:[]}
  const monthsUsed=new Set();

  raw.forEach(row=>{
    const egbs=eGBSCol?String(row[eGBSCol]??"").trim()||"(no eGBS)":"(no eGBS)";
    const po=String(row[poCol]??"").trim();
    const mk=parseActivityPeriod(row[activityPeriodCol]);
    const amt=parseAmt(row[amtCol]);
    if(!po||!mk)return;
    if(!ALL_MONTHS.includes(mk))return;
    monthsUsed.add(mk);
    if(!pivot[egbs])pivot[egbs]={};
    if(!pivot[egbs][po])pivot[egbs][po]={};
    if(!pivot[egbs][po][mk])pivot[egbs][po][mk]={amt:0,invDts:[]};
    pivot[egbs][po][mk].amt+=amt;
    if(invDtCol&&row[invDtCol]){
      const d=row[invDtCol];
      const ds=typeof d==="number"?XLSX.SSF.format("yyyy-mm-dd",d):String(d).trim();
      if(ds)pivot[egbs][po][mk].invDts.push(ds);
    }
  });

  const monthKeys=ALL_MONTHS.filter(m=>monthsUsed.has(m));
  const mKeys=monthKeys.length>=2?monthKeys:ALL_MONTHS;

  const records=[];
  Object.entries(pivot).forEach(([egbs,pos])=>{
    Object.entries(pos).forEach(([po,mdata])=>{
      const months={},invMonths={};
      mKeys.forEach(mk=>{months[mk]=mdata[mk]?.amt||0;invMonths[mk]=mdata[mk]?.invDts||[];});
      records.push({egbs,po,months,invMonths});
    });
  });
  return{records,monthKeys:mKeys};
}

// ═══════════════════════════════════════════════════════
// MATH
// ═══════════════════════════════════════════════════════
function medianOf(arr){
  if(!arr.length)return 0;
  const s=[...arr].sort((a,b)=>a-b);
  const m=Math.floor(s.length/2);
  return s.length%2?s[m]:(s[m-1]+s[m])/2;
}
// Base rate: ignore catch-up months by finding lower cluster
function baseAmt(amounts){
  const nz=[...amounts.filter(x=>x>0)].sort((a,b)=>a-b);
  if(!nz.length)return 0;
  if(nz.length===1)return nz[0];
  let cutIdx=nz.length;
  for(let i=1;i<nz.length;i++){if(nz[i]>=nz[i-1]*1.4){cutIdx=i;break;}}
  if(cutIdx===nz.length)cutIdx=Math.max(1,Math.ceil(nz.length*0.6));
  return medianOf(nz.slice(0,cutIdx));
}
function near(val,tgt,pct){return tgt>0&&Math.abs(val-tgt)<=pct*tgt;}
function fmt(n){return n?new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format(n):"-";}
function fmtS(n){
  if(!n)return "—";
  if(Math.abs(n)>=1000000)return "$"+(n/1e6).toFixed(1)+"M";
  if(Math.abs(n)>=1000)return "$"+(n/1000).toFixed(0)+"k";
  return "$"+Math.round(n);
}

// ═══════════════════════════════════════════════════════
// BILLING DETECTION
// minGap=1 → monthly (any 2 consecutive months = monthly service)
// ═══════════════════════════════════════════════════════
function detectBilling(amounts){
  const idx=amounts.map((v,i)=>v>0?i:-1).filter(i=>i>=0);
  if(idx.length<=1)return{type:"annual",gap:12};
  const gaps=[];
  for(let i=1;i<idx.length;i++)gaps.push(idx[i]-idx[i-1]);
  const minGap=Math.min(...gaps);
  const med=medianOf(gaps);
  if(minGap<=1)return{type:"monthly",gap:1};
  if(med>=9||idx.length<=2)return{type:"annual",gap:Math.round(med)||12};
  if(med>=2.5)return{type:"quarterly",gap:Math.round(med)};
  return{type:"monthly",gap:1};
}

// ═══════════════════════════════════════════════════════
// GAP CANDIDATES
// ═══════════════════════════════════════════════════════
function gapCandidates(amounts,billing,first,last,lastIdx,isMain){
  const{type,gap}=billing;const c=new Set();
  if(type==="annual"){
    const next=last+gap;if(next<=lastIdx&&amounts[next]===0)c.add(next);return c;
  }
  if(type==="quarterly"){
    let pos=first;
    while(pos+gap<=lastIdx){
      pos+=gap;
      const win=[pos-1,pos,pos+1].filter(x=>x>=0&&x<amounts.length);
      if(!win.some(x=>amounts[x]>0))c.add(pos);
    }
    return c;
  }
  // monthly: every zero in active range
  for(let i=first;i<=last;i++){if(amounts[i]===0)c.add(i);}
  // trailing: main PO goes all the way to current month (not Apr-26 fixed)
  if(isMain){
    const trailEnd=Math.min(CURRENT_MONTH_IDX>=0?CURRENT_MONTH_IDX:lastIdx,lastIdx);
    for(let gi=last+1;gi<=trailEnd;gi++)c.add(gi);
  } else {
    for(let gi=last+1;gi<=lastIdx;gi++){
      const ws=Math.max(0,gi-4);
      if(amounts.slice(ws,gi).filter(x=>x>0).length>=2)c.add(gi);else break;
    }
  }
  return c;
}

function toRuns(sorted){
  if(!sorted.length)return[];
  const runs=[[sorted[0]]];
  for(let i=1;i<sorted.length;i++){
    sorted[i]===sorted[i-1]+1?runs[runs.length-1].push(sorted[i]):runs.push([sorted[i]]);
  }
  return runs;
}

// ═══════════════════════════════════════════════════════
// RESOLVE GAPS — same v8.2 logic with usedSibPayments fix
// ═══════════════════════════════════════════════════════
function resolveAllGaps(gapSet,amounts,monthKeys,typ,sibs,lookahead){
  const gaps=[...gapSet].sort((a,b)=>a-b);
  const flagged={};
  const covered=new Set();
  const usedSibPayments=new Set();
  const runs=toRuns(gaps);

  runs.forEach(run=>{
    // PASS A: cross-eGBS run consolidation
    for(let start=0;start<run.length;start++){
      for(let len=run.length-start;len>=1;len--){
        const subRun=run.slice(start,start+len);
        if(subRun.some(g=>covered.has(g)))continue;
        const N=len;const lastGi=subRun[subRun.length-1];
        let found=false;
        for(let delta=-2;delta<=lookahead&&!found;delta++){
          const ti=lastGi+delta;
          if(ti<0||ti>=amounts.length)continue;
          for(const sib of sibs){
            const payKey=`${sib.po}:${ti}`;
            if(usedSibPayments.has(payKey))continue;
            const sibAmt=sib.months[monthKeys[ti]]??0;
            if(sibAmt<=0)continue;
            for(let checkN=N;checkN<=N+3;checkN++){
              if(near(sibAmt,checkN*typ,0.25)){
                const invInfo=sib.invMonths?.[monthKeys[ti]]?.length
                  ?` (inv: ${[...new Set(sib.invMonths[monthKeys[ti]])].join(", ")})`:"";
                const note=`${checkN}-month billing in ${sib.po} (${fmt(sibAmt)}) at ${monthKeys[ti]}${invInfo} — cross-eGBS consolidation (±25% of ${fmt(checkN*typ)})`;
                usedSibPayments.add(payKey);
                subRun.forEach(g=>{covered.add(g);flagged[g]={status:"catchup",note};});
                found=true;break;
              }
            }
            if(found)break;
          }
        }
      }
    }

    // PASS B: individual gap checks
    run.filter(gi=>!covered.has(gi)).forEach(gi=>{
      // 1. Same-month sibling within ±50% of typical
      for(const sib of sibs){
        const sibAmt=sib.months[monthKeys[gi]]??0;
        const payKey=`${sib.po}:${gi}`;
        if(sibAmt>0&&!usedSibPayments.has(payKey)&&near(sibAmt,typ,0.50)){
          usedSibPayments.add(payKey);covered.add(gi);
          flagged[gi]={status:"catchup",note:`Covered by ${sib.po} (${fmt(sibAmt)}) — renewal/replacement PO (±50% of ${fmt(typ)})`};
          return;
        }
      }
      // 2. Same-PO catch-up ±20%, N up to 6
      for(let a=1;a<=lookahead;a++){
        const ti=gi+a;if(ti>=amounts.length)break;
        const fa=amounts[ti];if(fa<=0)continue;
        let found=false;
        for(let N=2;N<=6;N++){
          if(near(fa,N*typ,0.20)){
            covered.add(gi);
            flagged[gi]={status:"catchup",note:`${N}-month billing on same PO at ${monthKeys[ti]} (${fmt(fa)}) — covers ${N-1} missed month(s) (±20% of ${fmt(N*typ)})`};
            found=true;break;
          }
        }
        if(found)return;
      }
      // 3. True gap → check if this is current month → ACCRUAL
      const nzIdx=amounts.map((v,i)=>v>0?i:-1).filter(i=>i>=0);
      const lastNz=nzIdx.length?nzIdx[nzIdx.length-1]:-1;
      const isCurrentMonth=monthKeys[gi]===CURRENT_MONTH;
      flagged[gi]={
        status:"gap",
        accrual:isCurrentMonth,
        note:isCurrentMonth
          ?`⚡ ACCRUAL NEEDED — ${monthKeys[gi]} billing missing. Expected ~${fmt(typ)}/month. No coverage found on this or sibling POs.`
          :gi>lastNz
            ?`${monthKeys[gi]} missing — PO active in prior months, expected ~${fmt(typ)}/month`
            :`Missing ~${fmt(typ)}/month. No same-PO or cross-eGBS catch-up found.`
      };
    });
  });
  return flagged;
}

// ═══════════════════════════════════════════════════════
// MAIN ANALYSIS
// ═══════════════════════════════════════════════════════
function analyzeAll(records,monthKeys){
  const byEgbs={};
  records.forEach(r=>{
    if(!byEgbs[r.egbs])byEgbs[r.egbs]=[];
    byEgbs[r.egbs].push(r);
  });

  const all=[];
  const lastIdx=monthKeys.length-1;

  Object.entries(byEgbs).forEach(([egbs,pos])=>{
    // Identifier-level billing: if any PO is monthly → all are monthly
    const indivBillings=pos.map(po=>detectBilling(monthKeys.map(mk=>po.months[mk]??0)));
    const egbsBillingType=indivBillings.some(b=>b.type==="monthly")?"monthly"
      :indivBillings.some(b=>b.type==="quarterly")?"quarterly":"annual";
    const egbsGap=egbsBillingType==="monthly"?1
      :indivBillings.find(b=>b.type===egbsBillingType)?.gap||3;

    // Main PO = most billing months (≥3 required)
    const nzCounts=pos.map(po=>monthKeys.filter(mk=>(po.months[mk]??0)>0).length);
    const maxNz=Math.max(...nzCounts);
    const mainPoIdx=maxNz>=3
      ?nzCounts.reduce((bestI,cnt,i)=>{
          if(cnt<maxNz)return bestI;
          const lA=monthKeys.map((mk,mi)=>(pos[i].months[mk]??0)>0?mi:-1).filter(x=>x>=0).slice(-1)[0]??-1;
          const lB=monthKeys.map((mk,mi)=>(pos[bestI].months[mk]??0)>0?mi:-1).filter(x=>x>=0).slice(-1)[0]??-1;
          return lA>=lB?i:bestI;
        },0)
      :0;

    pos.forEach((po,poIdx)=>{
      const amounts=monthKeys.map(mk=>po.months[mk]??0);
      const nzIdx=amounts.map((v,i)=>v>0?i:-1).filter(i=>i>=0);
      const isMain=poIdx===mainPoIdx;
      const billing={type:egbsBillingType,gap:egbsGap};

      if(!nzIdx.length){
        all.push({egbs,po:po.po,amounts,flagged:{},monthKeys,typ:0,billing,hasFlag:false,accrualNeeded:false,invMonths:po.invMonths||{},isMain,skipReason:"No billing data"});
        return;
      }
      // Skip POs with ≤3 billing months
      if(nzIdx.length<=3){
        all.push({egbs,po:po.po,amounts,flagged:{},monthKeys,typ:baseAmt(amounts),billing,hasFlag:false,accrualNeeded:false,invMonths:po.invMonths||{},isMain,skipReason:"≤3 billing months — insufficient data"});
        return;
      }

      const first=nzIdx[0],last=nzIdx[nzIdx.length-1];
      const typ=baseAmt(amounts);
      if(typ===0){
        all.push({egbs,po:po.po,amounts,flagged:{},monthKeys,typ:0,billing,hasFlag:false,accrualNeeded:false,invMonths:po.invMonths||{},isMain,skipReason:"Zero amount"});
        return;
      }

      const lookahead=billing.type==="quarterly"?billing.gap+1:3;
      const sibs=pos.filter((_,i)=>i!==poIdx).map(p=>({
        po:p.po,
        months:monthKeys.reduce((o,mk)=>{o[mk]=p.months[mk]??0;return o;},{}),
        invMonths:p.invMonths||{}
      }));

      const cands=gapCandidates(amounts,billing,first,last,lastIdx,isMain);
      let flagged={};
      if(cands.size>0)flagged=resolveAllGaps(cands,amounts,monthKeys,typ,sibs,lookahead);

      // Accrual needed = current month flagged as true gap
      const curIdx=monthKeys.indexOf(CURRENT_MONTH);
      const accrualNeeded=curIdx>=0&&flagged[curIdx]?.status==="gap";

      all.push({egbs,po:po.po,amounts,flagged,monthKeys,typ,billing,hasFlag:Object.keys(flagged).length>0,accrualNeeded,invMonths:po.invMonths||{},isMain,skipReason:null});
    });
  });
  return all;
}

// ═══════════════════════════════════════════════════════
// EXCEL EXPORT
// ═══════════════════════════════════════════════════════
async function exportExcel(allRows,monthKeys,fileName){
  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet("Accrual Report");
  const fill=(c,h)=>{c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF"+h}};};
  const font=(c,h,bold=false,sz=10)=>{c.font={color:{argb:"FF"+h},bold,size:sz,name:"Calibri"};};
  const bdr=(c)=>{const e={style:"thin",color:{argb:"FFDDDDDD"}};c.border={top:e,left:e,bottom:e,right:e};};

  // Columns: Parent eGBS | PO | Billing | ACCRUAL (current month) | months... | Issues
  const hdr=ws.addRow(["Parent eGBS","PO Number","Billing",`ACCRUAL (${CURRENT_MONTH})`,...monthKeys,"Historical Issues"]);
  hdr.height=26;
  hdr.eachCell(c=>{fill(c,"1F3864");font(c,"FFFFFF",true,10);c.alignment={vertical:"middle",horizontal:"center",wrapText:true};bdr(c);});
  hdr.getCell(1).alignment={vertical:"middle",horizontal:"left"};
  hdr.getCell(2).alignment={vertical:"middle",horizontal:"left"};
  hdr.getCell(4).font={color:{argb:"FFFF4444"},bold:true,size:10,name:"Calibri"};

  ws.getColumn(1).width=20;ws.getColumn(2).width=22;ws.getColumn(3).width=13;ws.getColumn(4).width=16;
  monthKeys.forEach((_,i)=>{ws.getColumn(i+5).width=11;});
  ws.getColumn(monthKeys.length+5).width=65;
  ws.views=[{state:"frozen",xSplit:4,ySplit:1,activeCell:"E2"}];

  const egbsOrder=[...new Set(allRows.map(r=>r.egbs))];
  allRows.forEach(r=>{
    const issues=Object.entries(r.flagged)
      .filter(([,fl])=>fl.status==="gap"&&r.monthKeys[Number(Object.keys(r.flagged).find(k=>k===Object.keys(r.flagged)[Object.keys(r.flagged).indexOf(Object.keys(r.flagged).find(kk=>kk===Object.keys(r.flagged)[0]))]))||0]!==CURRENT_MONTH)
      .map(([gi,fl])=>`[${r.monthKeys[gi]}] ${fl.status==="gap"?"⚠ GAP":"✓ COVERED"}: ${fl.note}`)
      .join("  |  ");

    const allIssues=Object.entries(r.flagged)
      .map(([gi,fl])=>`[${r.monthKeys[gi]}] ${fl.status==="gap"?"⚠ GAP":"✓ COVERED"}: ${fl.note}`)
      .join("  |  ");

    // Accrual cell text
    const accrualText=r.skipReason?"N/A (skipped)":r.accrualNeeded?"YES — ACCRUAL NEEDED":
      r.flagged[r.monthKeys.indexOf(CURRENT_MONTH)]?.status==="catchup"?"Covered (catch-up)":"No — Billing present";

    const row=ws.addRow([r.egbs,r.po,"",...[accrualText],...r.amounts,allIssues||(r.skipReason?"⊘ "+r.skipReason:"✓ No issues")]);
    row.height=18;

    const isAlt=egbsOrder.indexOf(r.egbs)%2===0;
    const bg=isAlt?"182535":"141E2E";

    fill(row.getCell(1),bg);font(row.getCell(1),"4FC3F7",true,9);bdr(row.getCell(1));
    fill(row.getCell(2),bg);font(row.getCell(2),"9FA8DA");bdr(row.getCell(2));
    const bc={monthly:"2196F3",quarterly:"9C27B0",annual:"FF9800",none:"888888"};
    fill(row.getCell(3),bg);
    font(row.getCell(3),bc[r.billing.type]||"888888",r.isMain,9);
    row.getCell(3).value=(r.isMain?"★ ":"")+r.billing.type.toUpperCase();
    row.getCell(3).alignment={horizontal:"center",vertical:"middle"};bdr(row.getCell(3));

    // Accrual cell — RED if needed, GREEN if not
    const ac=row.getCell(4);
    if(r.skipReason){fill(ac,"222222");font(ac,"555555",false,9);}
    else if(r.accrualNeeded){fill(ac,"CC0000");font(ac,"FFFFFF",true,10);}
    else if(r.flagged[r.monthKeys.indexOf(CURRENT_MONTH)]?.status==="catchup"){fill(ac,"FFA500");font(ac,"000000",true,9);}
    else{fill(ac,"1B5E20");font(ac,"AAFFAA",false,9);}
    ac.value=accrualText;
    ac.alignment={horizontal:"center",vertical:"middle",wrapText:true};bdr(ac);

    r.amounts.forEach((amt,i)=>{
      const cell=row.getCell(i+5);
      const flag=r.flagged[i];
      const invDts=r.invMonths[r.monthKeys[i]]||[];
      const invNote=invDts.length?`\nInv dates: ${[...new Set(invDts)].join(", ")}`:"";
      const isCurMonth=r.monthKeys[i]===CURRENT_MONTH;
      if(flag){
        const isAccrual=flag.status==="gap"&&isCurMonth;
        fill(cell,flag.status==="gap"?(isAccrual?"FF0000":"FFFF00"):"FFA500");
        font(cell,flag.status==="gap"?(isAccrual?"FFFFFF":"000000"):"000000",true);
        cell.value=amt>0?amt:0;
        try{cell.note={texts:[{text:flag.note+invNote,font:{size:9,name:"Calibri"}}]};}catch(e){}
      } else if(amt>0){
        // Highlight current month column slightly if no issue
        fill(cell,isCurMonth?(isAlt?"1A4A2A":"163020"):(isAlt?"1E3A5F":"1A3050"));
        font(cell,isCurMonth?"88FFAA":"B0C4DE");cell.value=amt;
        if(invNote){try{cell.note={texts:[{text:"Normal billing"+invNote,font:{size:9}}]};}catch(e){}}
      } else {
        fill(cell,isCurMonth?(isAlt?"1A1A1A":"151515"):(bg));
        font(cell,isCurMonth?"333333":"3A4A5A");cell.value="";
      }
      cell.numFmt="#,##0";cell.alignment={horizontal:"right",vertical:"middle"};bdr(cell);
    });

    const sc=row.getCell(monthKeys.length+5);
    sc.value=allIssues||(r.skipReason?"⊘ "+r.skipReason:"✓ No issues");
    sc.alignment={wrapText:true,vertical:"top"};
    if(r.skipReason)font(sc,"555555",false,9);
    else if(r.accrualNeeded)font(sc,"FF6666",false,9);
    else if(r.hasFlag)font(sc,"FFC107",false,9);
    else font(sc,"4CAF50",false,9);
    fill(sc,bg);bdr(sc);
  });

  // Accrual Summary sheet
  const sumWs=wb.addWorksheet("Accrual Summary");
  sumWs.getColumn(1).width=20;sumWs.getColumn(2).width=24;sumWs.getColumn(3).width=16;sumWs.getColumn(4).width=18;
  const sh=sumWs.addRow(["Parent eGBS","PO Number","Base Rate/Month","Accrual Status"]);
  sh.height=22;sh.eachCell(c=>{fill(c,"1F3864");font(c,"FFFFFF",true);c.alignment={vertical:"middle",horizontal:"center"};const e={style:"thin",color:{argb:"FFCCCCCC"}};c.border={top:e,left:e,bottom:e,right:e};});

  const accrualRows=allRows.filter(r=>r.accrualNeeded);
  accrualRows.forEach(r=>{
    const lr=sumWs.addRow([r.egbs,r.po,r.typ,`YES — ACCRUAL NEEDED for ${CURRENT_MONTH}`]);
    lr.height=18;
    fill(lr.getCell(1),"1a0000");font(lr.getCell(1),"FF8888",true,10);
    fill(lr.getCell(2),"1a0000");font(lr.getCell(2),"FF6666",false,10);
    fill(lr.getCell(3),"1a0000");font(lr.getCell(3),"FF9999",false,10);lr.getCell(3).numFmt="#,##0";lr.getCell(3).alignment={horizontal:"right"};
    fill(lr.getCell(4),"CC0000");font(lr.getCell(4),"FFFFFF",true,10);lr.getCell(4).alignment={horizontal:"center"};
    const e={style:"thin",color:{argb:"FFCCCCCC"}};
    lr.eachCell(c=>{c.border={top:e,left:e,bottom:e,right:e};});
  });
  if(!accrualRows.length){
    const nr=sumWs.addRow(["","",`No accruals needed for ${CURRENT_MONTH}`,""]);
    nr.getCell(3).alignment={horizontal:"center"};
    fill(nr.getCell(3),"1B5E20");font(nr.getCell(3),"88FF88",true,10);
  }

  // Legend
  const leg=wb.addWorksheet("Legend");
  leg.getColumn(1).width=30;leg.getColumn(2).width=72;
  [
    ["Color / Status","Explanation"],
    ["🔴 RED — ACCRUAL NEEDED","Current month billing is MISSING on this PO and no sibling PO under the same Parent eGBS covers it. Raise an accrual."],
    ["🟡 YELLOW — Historical Gap","Past month billing was missing. No catch-up or sibling coverage found for that month."],
    ["🟠 ORANGE — Covered / Catch-up","Billing accounted for: same PO billed N months together (±20%), or sibling eGBS PO covered it (±25%). No accrual needed."],
    ["🟢 GREEN — Billing Present (current month)","Current month has normal billing. No accrual needed."],
    ["🔵 Blue — Normal Spend (past)","Past month billing present, no issue."],
    ["⊘ Skipped","≤3 billing months — not enough data to determine billing pattern."],
    ["",""],
    ["MONTHLY Billing","Detected when any 2 consecutive months have billing (minGap rule). All zeros within active range + trailing to current month checked."],
    ["QUARTERLY","Bills every ~3 months. Only expected quarterly slots checked."],
    ["ANNUAL","1-2 payments in window. Internal blanks NOT flagged."],
    ["★ Main PO","PO with most billing months under a Parent eGBS. Trailing gaps extend to current month. Sibling POs have softer trailing rule."],
    ["",""],
    ["Base Rate (not median/average)","Amounts sorted → first jump >1.4× = catch-up boundary → median of values below = base rate. Prevents catch-up months inflating the threshold."],
    ["usedSibPayments guard","A sibling payment can only cover ONE run of gaps. Prevents the same payment being reused to cover additional gaps (e.g. Mar-26 ≈2×typ covers Feb+Mar but NOT Apr separately)."],
    ["Dynamic month range","Always starts Jan of previous year → current month. Extends automatically as you add new monthly data."],
  ].forEach((row,ri)=>{
    const lr=leg.addRow(row);lr.height=ri<=6?22:20;
    const e={style:"thin",color:{argb:"FFCCCCCC"}};
    if(ri===0){lr.eachCell(c=>{fill(c,"1F3864");font(c,"FFFFFF",true);});}
    else if(ri===1){fill(lr.getCell(1),"CC0000");font(lr.getCell(1),"FFFFFF",true);}
    else if(ri===2){fill(lr.getCell(1),"FFFF00");font(lr.getCell(1),"000000",true);}
    else if(ri===3){fill(lr.getCell(1),"FFA500");font(lr.getCell(1),"000000",true);}
    else if(ri===4){fill(lr.getCell(1),"1B5E20");font(lr.getCell(1),"88FF88",true);}
    else if(ri===5){fill(lr.getCell(1),"1E3A5F");font(lr.getCell(1),"B0C4DE",true);}
    else if(ri===6){fill(lr.getCell(1),"1a1a2a");font(lr.getCell(1),"555555",true);}
    else if(["MONTHLY Billing","QUARTERLY","ANNUAL","★ Main PO"].includes(row[0])){font(lr.getCell(1),"2196F3",true);font(lr.getCell(2),"BBBBBB");}
    else if(row[0]){font(lr.getCell(1),"7799CC",true);font(lr.getCell(2),"999999");}
    lr.eachCell(c=>{c.border={top:e,left:e,bottom:e,right:e};c.alignment={vertical:"top",wrapText:true};});
  });

  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=(fileName||"Report").replace(/\.xlsx$/i,"")+`_ACCRUAL_${CURRENT_MONTH.replace("-","")}.xlsx`;
  a.click();URL.revokeObjectURL(url);
}

// ═══════════════════════════════════════════════════════
// UI
// ═══════════════════════════════════════════════════════
const FS={
  gap:    {bg:"#FFD700",text:"#000",border:"#B8860B",label:"⚠ Gap"},
  catchup:{bg:"#FF8C00",text:"#fff",border:"#cc5500",label:"↑ Covered"},
};
const FS_ACCRUAL={bg:"#CC0000",text:"#fff",border:"#880000",label:"🔴 ACCRUAL"};
const BC={monthly:"#4fc3f7",quarterly:"#a78bfa",annual:"#fb923c",none:"#555"};
const M="'JetBrains Mono','Courier New',monospace";
const btnSt=(bg,bd,col,fw)=>({background:bg,border:`1px solid ${bd}`,borderRadius:7,color:col,padding:"7px 13px",fontSize:11,cursor:"pointer",fontFamily:M,fontWeight:fw||400});

function ColMapper({headers,colMap,onChange}){
  const fields=[
    {key:"eGBSCol",          label:"Parent eGBS column",   required:true},
    {key:"poCol",            label:"Purchase Order column", required:true},
    {key:"activityPeriodCol",label:"Activity Period column",required:true},
    {key:"amtCol",           label:"Amount (Amt) column",  required:true},
    {key:"invDtCol",         label:"Invoice Date (optional)",required:false},
  ];
  return(
    <div style={{background:"#0d1219",border:"1px solid #2a3560",borderRadius:10,padding:16,marginBottom:16}}>
      <div style={{fontSize:12,color:"#4fc3f7",fontWeight:700,marginBottom:12}}>📋 Column Mapping</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:10}}>
        {fields.map(f=>(
          <div key={f.key} style={{display:"flex",flexDirection:"column",gap:4}}>
            <label style={{fontSize:10,color:f.required?"#9fa8da":"#5a6a8a"}}>{f.label}{f.required?" *":""}</label>
            <select value={colMap[f.key]||""} onChange={e=>onChange({...colMap,[f.key]:e.target.value||null})}>
              <option value="">{f.required?"-- select --":"-- none --"}</option>
              {headers.map(h=><option key={h} value={h}>{h}</option>)}
            </select>
          </div>
        ))}
      </div>
      <div style={{marginTop:10,fontSize:10,color:"#4a5580"}}>* Required. Auto-detected — please confirm before running.</div>
    </div>
  );
}

function App(){
  const [stage,setStage]        =useState("upload");
  const [rawWb,setRawWb]        =useState(null);
  const [rawSheet,setRawSheet]  =useState(null);
  const [sheetName,setSheetName]=useState("");
  const [sheetNames,setSheetNames]=useState([]);
  const [headers,setHeaders]    =useState([]);
  const [colMap,setColMap]      =useState({});
  const [parsed,setParsed]      =useState(null);
  const [allRows,setAllRows]    =useState([]);
  const [loading,setLoading]    =useState(false);
  const [error,setError]        =useState("");
  const [filter,setFilter]      =useState("all");
  const [search,setSearch]      =useState("");
  const [expanded,setExpanded]  =useState({});
  const [fileName,setFileName]  =useState("");
  const [exporting,setExp]      =useState(false);

  const loadSheet=useCallback((workbook,name)=>{
    try{
      const ws=workbook.Sheets[name];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:null,header:1,raw:true});
      let hdrIdx=0;
      for(let i=0;i<Math.min(10,rows.length);i++){
        if(rows[i].filter(v=>v!=null&&v!=="").length>3){hdrIdx=i;break;}
      }
      const hdrs=rows[hdrIdx].map((v,i)=>v!=null&&String(v).trim()?String(v).trim():`Col_${i+1}`);
      setHeaders(hdrs);setRawSheet(ws);setSheetName(name);
      setColMap(autoDetectCols(hdrs));setStage("mapping");
    }catch(e){setError("Sheet error: "+e.message);}
    finally{setLoading(false);}
  },[]);

  const handleFile=useCallback(async file=>{
    if(!file)return;
    setLoading(true);setError("");setFileName(file.name);
    setStage("upload");setAllRows([]);setParsed(null);setExpanded({});
    try{
      const buf=await file.arrayBuffer();
      const workbook=XLSX.read(buf,{type:"array",cellDates:false});
      setRawWb(workbook);setSheetNames(workbook.SheetNames);
      const best=workbook.SheetNames.find(n=>/services|fdw|data|raw|detail/i.test(n))||workbook.SheetNames[0];
      loadSheet(workbook,best);
    }catch(e){setError("File read error: "+e.message);setLoading(false);}
  },[loadSheet]);

  const onDrop=useCallback(e=>{e.preventDefault();const f=e.dataTransfer?.files?.[0];if(f)handleFile(f);},[handleFile]);

  const runAnalysis=useCallback(()=>{
    if(!rawSheet)return;
    setLoading(true);setError("");
    try{
      const result=buildPivotFromRaw(rawSheet,colMap);
      if(!result||!result.records.length)throw new Error("Could not build pivot. Check column mapping.");
      setParsed(result);setAllRows(analyzeAll(result.records,result.monthKeys));setStage("results");
    }catch(e){setError(e.message);}
    finally{setLoading(false);}
  },[rawSheet,colMap]);

  const doExport=async()=>{
    if(!allRows.length||!parsed)return;
    setExp(true);
    try{await exportExcel(allRows,parsed.monthKeys,fileName);}
    catch(e){alert("Export error: "+e.message);}
    finally{setExp(false);}
  };

  const reset=()=>{setStage("upload");setRawWb(null);setRawSheet(null);setHeaders([]);setColMap({});setParsed(null);setAllRows([]);setError("");setFileName("");setExpanded({});setFilter("all");setSearch("");};
  const toggleAll=open=>{const m={};shown.forEach(r=>{m[`${r.egbs}:${r.po}`]=open;});setExpanded(m);};

  const shown=useMemo(()=>allRows.filter(r=>{
    const mf=filter==="all"?true
      :filter==="accrual"?r.accrualNeeded
      :filter==="flagged"?r.hasFlag
      :filter==="clean"?(!r.hasFlag&&!r.skipReason)
      :filter==="skipped"?!!r.skipReason
      :Object.values(r.flagged).some(f=>f.status===filter);
    const ms=!search
      ||r.egbs.toLowerCase().includes(search.toLowerCase())
      ||r.po.toLowerCase().includes(search.toLowerCase());
    return mf&&ms;
  }),[allRows,filter,search]);

  const sum=useMemo(()=>{
    let accrual=0,gaps=0,catchups=0,clean=0,skipped=0,monthly=0,quarterly=0,annual=0;
    allRows.forEach(r=>{
      if(r.accrualNeeded)accrual++;
      Object.values(r.flagged).forEach(f=>f.status==="gap"?gaps++:catchups++);
      if(r.skipReason)skipped++;
      else if(!r.hasFlag)clean++;
      if(r.billing.type==="monthly")monthly++;
      else if(r.billing.type==="quarterly")quarterly++;
      else if(r.billing.type==="annual")annual++;
    });
    return{total:allRows.length,accrual,gaps,catchups,clean,skipped,flagged:allRows.filter(r=>r.hasFlag).length,monthly,quarterly,annual};
  },[allRows]);

  const canAnalyze=!!(colMap.eGBSCol&&colMap.poCol&&colMap.activityPeriodCol&&colMap.amtCol);

  return(
    <div style={{minHeight:"100vh",background:"#0f1117",color:"#e8e8e8",fontFamily:M}}>

      {/* HEADER */}
      <div style={{background:"linear-gradient(135deg,#1a1d2e,#0f1117)",borderBottom:"1px solid #2a2d3e",padding:"14px 20px",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
        <div style={{width:32,height:32,background:"linear-gradient(135deg,#ff4444,#cc0000)",borderRadius:7,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>⚡</div>
        <div>
          <div style={{fontSize:15,fontWeight:700,color:"#fff"}}>
            PO Accrual Analyzer&nbsp;
            <span style={{fontSize:10,color:"#ff6666",border:"1px solid #ff444444",borderRadius:4,padding:"1px 6px"}}>eGBS Edition</span>
          </div>
          <div style={{fontSize:9,color:"#6c7aa0",letterSpacing:1}}>
            CHECKING: <span style={{color:"#ff6666",fontWeight:700}}>{CURRENT_MONTH}</span> &nbsp;·&nbsp;
            RANGE: {ALL_MONTHS[0]} → {ALL_MONTHS[ALL_MONTHS.length-1]} &nbsp;·&nbsp;
            PARENT eGBS GROUPING
          </div>
        </div>
        {stage==="results"&&(
          <div style={{marginLeft:"auto",display:"flex",gap:8,flexWrap:"wrap"}}>
            <button onClick={()=>toggleAll(true)}  style={btnSt("#1a1d2e","#2a3560","#9fa8da")}>⊞ Expand All</button>
            <button onClick={()=>toggleAll(false)} style={btnSt("#1a1d2e","#2a3560","#9fa8da")}>⊟ Collapse All</button>
            <button onClick={doExport} disabled={exporting}
              style={btnSt(exporting?"#1a2a1a":"#1b5e20","#4caf50",exporting?"#555":"#fff",700)}>
              {exporting?"⏳ Exporting…":"⬇ Export Excel with Highlights"}
            </button>
            <button onClick={reset} style={btnSt("#1a1d2e","#2a3560","#9fa8da")}>↩ New File</button>
          </div>
        )}
      </div>

      <div style={{padding:"18px 20px"}}>

        {/* UPLOAD */}
        {stage==="upload"&&!loading&&(
          <div onDrop={onDrop} onDragOver={e=>e.preventDefault()}
            onClick={()=>document.getElementById("fi").click()}
            style={{border:"2px dashed #2a3560",borderRadius:12,padding:"50px 36px",textAlign:"center",background:"#13162a",cursor:"pointer"}}>
            <div style={{fontSize:40,marginBottom:10}}>📂</div>
            <div style={{fontSize:15,fontWeight:600,color:"#c5cae9",marginBottom:6}}>Drop your RAW data Excel file here</div>
            <div style={{fontSize:11,color:"#4a5580",marginBottom:4}}>Checking for accruals: <b style={{color:"#ff6666"}}>{CURRENT_MONTH}</b> &nbsp;|&nbsp; Range: {ALL_MONTHS[0]} → {ALL_MONTHS[ALL_MONTHS.length-1]}</div>
            <div style={{fontSize:11,color:"#3a5570",marginBottom:18}}>Needs: Parent eGBS · Purchase Order · Activity Period · Amount · (optional) Invoice Date</div>
            <div style={{display:"inline-block",background:"linear-gradient(135deg,#1565c0,#0d47a1)",color:"#fff",padding:"9px 24px",borderRadius:7,fontSize:13,fontWeight:600}}>CHOOSE FILE</div>
            <input id="fi" type="file" accept=".xlsx,.xls" style={{display:"none"}} onChange={e=>handleFile(e.target.files[0])}/>
          </div>
        )}

        {loading&&<div style={{textAlign:"center",padding:44}}><div style={{fontSize:28,marginBottom:8}}>⚙️</div><div style={{color:"#4fc3f7",fontSize:13}}>Processing {fileName}…</div></div>}
        {error&&<div style={{background:"#1e0a0a",border:"1px solid #8b0000",borderRadius:9,padding:13,color:"#ff6b6b",fontSize:12,marginTop:12}}>⚠ {error}</div>}

        {/* COLUMN MAPPING */}
        {stage==="mapping"&&!loading&&(
          <div>
            <div style={{background:"#0d1219",border:"1px solid #2a2d3e",borderRadius:8,padding:"10px 14px",marginBottom:14,display:"flex",gap:16,flexWrap:"wrap",alignItems:"center"}}>
              <span style={{fontSize:12,color:"#4fc3f7",fontWeight:700}}>📄 {fileName}</span>
              {sheetNames.length>1&&(
                <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                  <span style={{fontSize:10,color:"#4a5580"}}>Sheet:</span>
                  {sheetNames.map(s=>(
                    <button key={s} onClick={()=>{setLoading(true);loadSheet(rawWb,s);}}
                      style={btnSt(s===sheetName?"#1565c0":"#13162a",s===sheetName?"#4fc3f7":"#2a3560",s===sheetName?"#fff":"#9fa8da")}>{s}</button>
                  ))}
                </div>
              )}
              <span style={{fontSize:10,color:"#3a4a5a",marginLeft:"auto"}}>{headers.length} columns detected</span>
            </div>
            <ColMapper headers={headers} colMap={colMap} onChange={setColMap}/>
            <div style={{display:"flex",gap:10}}>
              <button onClick={runAnalysis} disabled={!canAnalyze}
                style={btnSt(canAnalyze?"linear-gradient(135deg,#1565c0,#0d47a1)":"#1a1d2e",canAnalyze?"#4fc3f7":"#2a3560",canAnalyze?"#fff":"#555",700)}>
                {canAnalyze?"▶ Run Accrual Analysis":"⚠ Map all required columns first"}
              </button>
              <button onClick={reset} style={btnSt("#1a1d2e","#2a3560","#9fa8da")}>↩ Back</button>
            </div>
          </div>
        )}

        {/* RESULTS */}
        {stage==="results"&&(
          <>
            {/* ACCRUAL ALERT BANNER */}
            {sum.accrual>0&&(
              <div style={{background:"linear-gradient(135deg,#3a0000,#220000)",border:"2px solid #cc0000",borderRadius:10,padding:"14px 18px",marginBottom:16,display:"flex",alignItems:"center",gap:14}}>
                <div style={{fontSize:28}}>🔴</div>
                <div>
                  <div style={{fontSize:14,fontWeight:700,color:"#ff4444"}}>
                    {sum.accrual} PO{sum.accrual!==1?"s":""} NEED ACCRUAL for {CURRENT_MONTH}
                  </div>
                  <div style={{fontSize:11,color:"#aa4444",marginTop:2}}>
                    Billing missing for current month — not covered by any sibling PO under the same Parent eGBS. Use "🔴 Accrual Needed" filter below.
                  </div>
                </div>
              </div>
            )}
            {sum.accrual===0&&(
              <div style={{background:"#0d1f0d",border:"1px solid #2e7d32",borderRadius:10,padding:"12px 18px",marginBottom:16,display:"flex",alignItems:"center",gap:12}}>
                <div style={{fontSize:22}}>✅</div>
                <div style={{fontSize:13,color:"#4CAF50",fontWeight:600}}>No accruals needed for {CURRENT_MONTH} — all POs have billing covered.</div>
              </div>
            )}

            {/* Summary cards */}
            <div style={{display:"flex",gap:8,marginBottom:13,flexWrap:"wrap"}}>
              {[
                {l:`🔴 Accrual (${CURRENT_MONTH})`,v:sum.accrual,c:"#CC0000",key:"accrual"},
                {l:"Total POs",     v:sum.total,    ic:"📋",c:"#4fc3f7",key:"all"},
                {l:"Clean",         v:sum.clean,    ic:"✓", c:"#4CAF50",key:"clean"},
                {l:"Historical Gaps",v:sum.gaps,    ic:"⚠", c:"#FFD700",key:"gap"},
                {l:"Covered",       v:sum.catchups, ic:"↑", c:"#FF8C00",key:"catchup"},
                {l:"Skipped",       v:sum.skipped,  ic:"⊘", c:"#555",   key:"skipped"},
                {l:"Monthly POs",   v:sum.monthly,  ic:"📅",c:BC.monthly,key:"_m"},
                {l:"Quarterly POs", v:sum.quarterly,ic:"🗓",c:BC.quarterly,key:"_q"},
                {l:"Annual POs",    v:sum.annual,   ic:"📆",c:BC.annual,key:"_a"},
              ].filter(c=>c.v>0).map(c=>(
                <div key={c.key||c.l}
                  onClick={c.key&&!c.key.startsWith("_")?()=>setFilter(c.key):undefined}
                  style={{flex:"1 1 90px",background:filter===c.key?"#1a2a3a":"#13162a",border:`1px solid ${c.c}${filter===c.key?"":"44"}`,borderRadius:9,padding:"11px 12px",cursor:c.key&&!c.key.startsWith("_")?"pointer":"default",transition:"all 0.15s"}}>
                  <div style={{fontSize:16,marginBottom:2}}>{c.ic||""}</div>
                  <div style={{fontSize:20,fontWeight:700,color:c.c}}>{c.v}</div>
                  <div style={{fontSize:9,color:"#6c7aa0"}}>{c.l}</div>
                </div>
              ))}
            </div>

            {/* Color key */}
            <div style={{background:"#0d1219",border:"1px solid #2a2d3e",borderRadius:8,padding:"8px 14px",marginBottom:10,fontSize:11,display:"flex",gap:14,flexWrap:"wrap",alignItems:"center"}}>
              <b style={{color:"#5a6a8a",fontSize:10}}>HIGHLIGHT:</b>
              <span><span style={{background:"#CC0000",color:"#fff",padding:"2px 8px",borderRadius:3,fontWeight:700}}>RED</span>&nbsp;= Accrual needed ({CURRENT_MONTH})</span>
              <span><span style={{background:"#FFFF00",color:"#000",padding:"2px 8px",borderRadius:3,fontWeight:700}}>YELLOW</span>&nbsp;= Historical gap</span>
              <span><span style={{background:"#FFA500",color:"#000",padding:"2px 8px",borderRadius:3,fontWeight:700}}>ORANGE</span>&nbsp;= Covered / catch-up</span>
              <span style={{color:"#3a5a7a",fontSize:10,marginLeft:"auto"}}>Range: {ALL_MONTHS[0]} → {ALL_MONTHS[ALL_MONTHS.length-1]}</span>
            </div>

            {/* Filters */}
            <div style={{display:"flex",gap:7,marginBottom:11,flexWrap:"wrap",alignItems:"center"}}>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search eGBS or PO…"
                style={{background:"#1a1d2e",border:"1px solid #2a3560",borderRadius:7,color:"#e8e8e8",padding:"7px 12px",fontSize:12,outline:"none",width:230,fontFamily:M}}/>
              {[
                {k:"all",    l:"All POs"},
                {k:"accrual",l:"🔴 Accrual Needed"},
                {k:"flagged",l:"⚠ All Flagged"},
                {k:"gap",    l:"🟡 Hist. Gaps"},
                {k:"catchup",l:"🟠 Covered"},
                {k:"clean",  l:"✓ Clean"},
                {k:"skipped",l:"⊘ Skipped"},
              ].map(f=>(
                <button key={f.k} onClick={()=>setFilter(f.k)}
                  style={btnSt(
                    filter===f.k?(f.k==="accrual"?"#CC0000":"#1565c0"):"#13162a",
                    filter===f.k?(f.k==="accrual"?"#ff6666":"#4fc3f7"):"#2a3560",
                    filter===f.k?"#fff":"#6c7aa0",
                    filter===f.k?700:400
                  )}>{f.l}</button>
              ))}
              <span style={{marginLeft:"auto",fontSize:11,color:"#4a5580"}}>{shown.length}/{allRows.length} POs</span>
            </div>

            {/* Results */}
            {shown.length===0
              ?<div style={{textAlign:"center",color:"#4a5580",padding:36,fontSize:13}}>No results match your filter.</div>
              :shown.map(r=>{
                const key=`${r.egbs}:${r.po}`;
                const open=expanded[key];
                const bc=BC[r.billing.type]||"#555";
                const hasGap=Object.values(r.flagged).some(f=>f.status==="gap"&&!f.accrual);
                const hasCU=Object.values(r.flagged).some(f=>f.status==="catchup");
                return(
                  <div key={key} style={{marginBottom:4,background:"#13162a",border:`2px solid ${r.accrualNeeded?"#cc0000":r.hasFlag?"#3a2a00":r.skipReason?"#1a1a1a":"#1a1e2e"}`,borderRadius:8,overflow:"hidden"}}>
                    <div onClick={()=>setExpanded(p=>({...p,[key]:!p[key]}))}
                      style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",cursor:"pointer",background:r.accrualNeeded?"#2a0000":r.hasFlag?"#1e1800":r.skipReason?"#111":"#141828",flexWrap:"wrap"}}>
                      {/* eGBS */}
                      <span style={{color:"#4fc3f7",fontWeight:700,minWidth:140,fontSize:11,flexShrink:0}}>{r.egbs}</span>
                      {/* PO */}
                      <span style={{color:r.skipReason?"#444":"#7788aa",fontSize:11,minWidth:155,flexShrink:0}}>{r.po}</span>
                      {/* Billing badge */}
                      <span style={{background:bc+"22",border:`1px solid ${bc}44`,borderRadius:10,padding:"1px 8px",fontSize:9,color:bc,flexShrink:0,textTransform:"uppercase"}}>{r.billing.type}</span>
                      {/* Status badges */}
                      {r.accrualNeeded&&(
                        <span style={{background:"#CC0000",borderRadius:4,padding:"2px 9px",fontSize:10,color:"#fff",fontWeight:700,flexShrink:0}}>🔴 ACCRUAL NEEDED</span>
                      )}
                      {r.skipReason
                        ?<span style={{color:"#444",fontSize:10}}>⊘ Skipped</span>
                        :!r.accrualNeeded&&(
                          <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                            {hasGap&&<span style={{background:"#FFD70022",border:"1px solid #FFD70055",borderRadius:4,padding:"1px 7px",fontSize:10,color:"#FFD700",fontWeight:700}}>⚠ HIST GAP</span>}
                            {hasCU&&<span style={{background:"#FF8C0022",border:"1px solid #FF8C0055",borderRadius:4,padding:"1px 7px",fontSize:10,color:"#FF8C00",fontWeight:700}}>↑ COVERED</span>}
                            {!r.hasFlag&&<span style={{color:"#4CAF5099",fontSize:10}}>✓ No issues</span>}
                            {Object.entries(r.flagged).filter(([,fl])=>!fl.accrual).map(([gi,fl])=>(
                              <span key={gi} style={{background:FS[fl.status]?.bg+"aa",color:FS[fl.status]?.text,borderRadius:4,padding:"1px 6px",fontSize:9,fontWeight:700}}>
                                {r.monthKeys[gi]}
                              </span>
                            ))}
                          </div>
                        )
                      }
                      <span style={{marginLeft:"auto",color:"#4a5580",fontSize:12,flexShrink:0}}>{open?"▲":"▼"}</span>
                    </div>

                    {open&&(
                      <div style={{padding:"10px 12px",overflowX:"auto",background:"#0f1117"}}>
                        <div style={{display:"flex",gap:3,minWidth:"max-content",marginBottom:8}}>
                          {r.monthKeys.map((mk,i)=>{
                            const amt=r.amounts[i];
                            const flag=r.flagged[i];
                            const isCur=mk===CURRENT_MONTH;
                            const invDts=r.invMonths[mk]||[];
                            const isLast=i===r.monthKeys.length-1;
                            const isAccrual=flag?.status==="gap"&&isCur;
                            const bg=isAccrual?"#CC0000":flag?FS[flag.status]?.bg:(amt>0?(isCur?"#1a4a2a":"#1a3560"):(isCur?"#1a1a1a":"#13162a"));
                            const tx=isAccrual?"#fff":flag?FS[flag.status]?.text:(amt>0?(isCur?"#88ffaa":"#aaccee"):(isCur?"#333":"#2a3a5a"));
                            return(
                              <div key={mk} style={{minWidth:62,textAlign:"center"}} title={flag?.note||(invDts.length?`Inv: ${invDts.join(", ")}`:"")}>
                                <div style={{fontSize:8,color:isCur?"#ff6666":isLast?"#ffa502":"#3a4a6a",marginBottom:2,fontWeight:isCur||isLast?700:400}}>
                                  {mk}{isCur?" ★":isLast?" ◄":""}
                                </div>
                                <div style={{background:bg,color:tx,borderRadius:4,padding:"4px 2px",fontSize:10,fontWeight:amt>0?600:400,border:isAccrual?"2px solid #ff4444":flag?`2px solid ${FS[flag.status]?.border}`:(isCur?"1px solid #336633":"1px solid #1e2a3a"),minHeight:26,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:1}}>
                                  {amt>0?fmtS(amt):"—"}
                                  {!flag&&invDts.length>0&&<div style={{fontSize:7,color:isCur?"#4a9a6a":"#4a7ab0",lineHeight:1}}>📄{invDts.length}</div>}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                        {/* Accrual note first */}
                        {r.accrualNeeded&&(
                          <div style={{display:"flex",gap:8,alignItems:"flex-start",marginBottom:6,padding:"8px 10px",background:"#2a000088",border:"2px solid #cc0000",borderRadius:5}}>
                            <span style={{fontWeight:700,color:"#ff4444",minWidth:50,fontSize:11,flexShrink:0}}>🔴 {CURRENT_MONTH}</span>
                            <span style={{fontSize:11,color:"#ff9999",lineHeight:1.5}}>{r.flagged[r.monthKeys.indexOf(CURRENT_MONTH)]?.note}</span>
                          </div>
                        )}
                        {/* Historical flags */}
                        {Object.entries(r.flagged).filter(([,fl])=>!fl.accrual).map(([gi,fl])=>(
                          <div key={gi} style={{display:"flex",gap:8,alignItems:"flex-start",marginBottom:3,padding:"5px 9px",background:FS[fl.status]?.bg+"18",borderLeft:`3px solid ${FS[fl.status]?.bg}`,borderRadius:3}}>
                            <span style={{fontWeight:700,color:FS[fl.status]?.bg,minWidth:50,fontSize:10,flexShrink:0}}>{r.monthKeys[gi]}</span>
                            <span style={{fontSize:10,color:"#aabbcc",lineHeight:1.5}}>{fl.note}</span>
                          </div>
                        ))}
                        {r.skipReason&&<div style={{color:"#44444499",fontSize:10,padding:"2px 0"}}>⊘ {r.skipReason}</div>}
                        {!r.hasFlag&&!r.skipReason&&<div style={{color:"#4CAF5066",fontSize:10,padding:"2px 0"}}>✓ All months accounted for — no accrual needed.</div>}
                        <div style={{marginTop:6,fontSize:9,color:"#3a4a5a",display:"flex",gap:16}}>
                          {r.typ>0&&<span>Base rate: <b style={{color:"#4466aa"}}>{fmt(r.typ)}</b>/mo</span>}
                          <span>Billing: <b style={{color:bc}}>{r.billing.type}</b>{r.billing.gap>0?` (~${r.billing.gap}mo)`:""}</span>
                          {r.isMain&&<span style={{color:"#4fc3f755"}}>★ Main PO</span>}
                        </div>
                      </div>
                    )}
                  </div>
                );
              })
            }
            <div style={{marginTop:12,color:"#2a3a4a",fontSize:10,textAlign:"right"}}>
              {fileName} · {parsed?.records?.length} POs · {sum.accrual} accruals needed · {sum.flagged} total flagged · {sum.clean} clean
            </div>
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
